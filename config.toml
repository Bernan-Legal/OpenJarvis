# OpenJarvis config — proyecto raíz (RTX 5090)
# NOTA: Este archivo NO es cargado por el framework.
# La config activa está en: C:\Users\USUARIO\.openjarvis\config.toml
# Este archivo se mantiene como referencia de hardware/scheduler.

[engine]
default = "ollama"

[engine.ollama]
host = "http://localhost:11434"
keep_alive = "2h"

[intelligence]
default_model = "teo"
fallback_model = "qwen2.5:7b-instruct"
temperature = 0.65
max_tokens = 4096

[agent]
default_agent = "react"
max_turns = 10
tools = "code_interpreter,web_search,file_read,shell_exec"

[sandbox]
enabled = true

[scheduler]
default_interval = "900s"
max_concurrent = 3

[logging]
level = "INFO"

# Tavily API key: configurar como variable de entorno TAVILY_API_KEY
# No almacenar keys aquí — el framework no lee este archivo en producción.
